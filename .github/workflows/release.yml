name: Release

# Cut a release by bumping "version" in package.json and adding a "## [0.2.0]" section to CHANGELOG.md on dev
# (it becomes the release notes), merging dev into main, then pushing a matching tag on main:
#   git tag v0.2.0 && git push origin v0.2.0
# Tags with a suffix (v0.2.0-rc.1) publish as a prerelease and do not move the "latest" image tag. They may be
# pushed on dev or main.
# Older GitHub releases are deleted afterwards (tags are kept): see "Remove superseded releases".

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match package.json version $pkg"
            exit 1
          fi
      # Stable releases must come from main. Pre-releases (v0.2.0-rc.1) may also come from dev, so an image can
      # be tested before the release PR into main merges.
      - name: Tagged commit is on main (or dev for a pre-release)
        run: |
          allowed="main"
          case "$GITHUB_REF_NAME" in *-*) allowed="main dev" ;; esac
          for branch in $allowed; do
            if git fetch -q origin "$branch" 2>/dev/null && git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch"; then
              exit 0
            fi
          done
          echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not on ${allowed// / or }"
          exit 1
      # Release notes come from CHANGELOG.md, so a stable release needs its section before anything is published.
      # Pre-releases without one fall back to GitHub's generated notes.
      - name: CHANGELOG has a section for this version
        run: |
          case "$GITHUB_REF_NAME" in *-*) exit 0 ;; esac
          if ! bash .github/scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > /dev/null; then
            echo "::error::CHANGELOG.md has no \"## [${GITHUB_REF_NAME#v}]\" section to use as release notes"
            exit 1
          fi

  checks:
    name: Checks
    needs: verify
    uses: ./.github/workflows/ci.yml

  publish-image:
    name: Publish Docker image
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # latest=auto only tags "latest" for non-prerelease semver tags.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  github-release:
    name: GitHub release
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # Notes are this version's CHANGELOG.md section rather than GitHub's generated notes, which list every PR
      # merged since the last tag (chores included).
      - name: Create release with CHANGELOG notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="${IMAGE,,}"
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac

          docker_section="$(printf '### Docker image\n\n```\ndocker pull %s:%s\n```\n' "$image" "$version")"
          if bash .github/scripts/release-notes.sh "$version" > notes.md; then
            printf '\n%s\n' "$docker_section" >> notes.md
            notes_args=(--notes-file notes.md)
          else
            # Only pre-releases get here: verify fails stable tags that have no CHANGELOG section.
            notes_args=(--generate-notes --notes "$docker_section")
          fi

          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            "${notes_args[@]}" \
            $prerelease
          printf '%s\n' "$docker_section" >> "$GITHUB_STEP_SUMMARY"

      # Keeps one release (and, while an RC is out, one pre-release). Only releases are deleted: the git
      # tags stay. A stable release removes every older release and pre-release; a pre-release removes
      # older pre-releases and leaves the current stable release alone. Drafts and anything newer than
      # this tag are never touched, so an older tag's run finishing late can't delete a newer release.
      - name: Remove superseded releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Semver-ish ordering with GNU sort -V; "-" becomes "~" so 1.0.0-rc.1 sorts before 1.0.0.
          key() { printf '%s' "${1#v}" | tr '-' '~'; }
          older() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$(key "$1")" "$(key "$2")" | sort -V | head -n1)" = "$(key "$1")" ]; }

          current="$GITHUB_REF_NAME"
          current_is_pre=false
          case "$current" in *-*) current_is_pre=true ;; esac

          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
            --json tagName,isPrerelease,isDraft \
            --jq '.[] | select(.isDraft | not) | "\(.tagName) \(.isPrerelease)"' |
          while read -r tag is_pre; do
            older "$tag" "$current" || continue
            if [ "$current_is_pre" = true ] && [ "$is_pre" != true ]; then
              continue
            fi
            echo "Deleting superseded release $tag (tag kept)"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          done
